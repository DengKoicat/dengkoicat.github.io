<script>
  document.addEventListener("DOMContentLoaded", function () {
    var previewLineCount = 18;

    document.querySelectorAll(".post-content pre > code").forEach(function (codeblock) {
      if (codeblock.classList.contains("language-mermaid") || codeblock.getAttribute("data-lang") === "mermaid") return;

      var pre = codeblock.parentElement;
      if (!pre) return;

      var container = pre.closest(".highlight") || pre;
      if (container.classList.contains("code-collapsible")) return;

      window.requestAnimationFrame(function () {
        var styles = window.getComputedStyle(codeblock);
        var lineHeight = parseFloat(styles.lineHeight) || 24;
        var previewHeight = Math.round(lineHeight * previewLineCount);

        if (codeblock.scrollHeight <= previewHeight + lineHeight * 2) return;

        container.classList.add("code-collapsible", "code-collapsed");
        codeblock.style.setProperty("--code-preview-height", previewHeight + "px");

        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "code-expand-toggle";
        toggle.setAttribute("aria-expanded", "false");
        toggle.textContent = "展开代码";

        toggle.addEventListener("click", function () {
          var isCollapsed = container.classList.toggle("code-collapsed");
          toggle.setAttribute("aria-expanded", String(!isCollapsed));
          toggle.textContent = isCollapsed ? "展开代码" : "收起代码";
        });

        container.appendChild(toggle);
      });
    });
  });
</script>

{{- if and (eq .Kind "page") (in .RawContent "```mermaid") }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

  var isDark = document.body.classList.contains("dark");

  mermaid.initialize({
    startOnLoad: false,
    theme: isDark ? "dark" : "default",
    securityLevel: "loose"
  });

  document.querySelectorAll('.post-content pre > code.language-mermaid, .post-content pre > code[data-lang="mermaid"]').forEach(function (codeblock) {
    var pre = codeblock.parentElement;
    if (!pre) return;

    var wrapper = pre.closest(".highlight") || pre;
    var diagram = document.createElement("div");
    diagram.className = "mermaid";
    diagram.textContent = codeblock.textContent;

    wrapper.replaceWith(diagram);
  });

  await mermaid.run({
    querySelector: ".post-content .mermaid"
  });
</script>
{{- end }}
